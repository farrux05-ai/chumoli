[project]
name = "uzpipe"
version = "0.1.0"
description = "Lightweight EL tool for Uzbekistan data sources, built on dlt"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "dlt[duckdb]>=1.30",
    "dlt[sql_database]>=1.30",
    "psycopg2-binary>=2.9",
    "pymysql>=1.1",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "cryptography>=42.0",
    "typer>=0.12",
    "rich>=13.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "apscheduler>=3.10",
]

[project.scripts]
uzpipe = "uzpipe.cli:main"
uzpipe-api = "uzpipe.api.app:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
postgres = [
    "dlt[postgres]>=1.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uzpipe"]

[tool.hatch.build.targets.wheel.sources]
"src/uzpipe" = "uzpipe"

[tool.hatch.build.targets.sdist]
include = [
    "src/uzpipe",
    "static",
    "README.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
