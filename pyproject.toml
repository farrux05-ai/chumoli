[project]
name = "chumoli"
dynamic = ["version"]
description = "Lightweight EL tool for Uzbekistan data sources, built on dlt"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
keywords = ["etl", "elt", "dlt", "uzbekistan", "data-pipeline", "duckdb"]
authors = [{ name = "farrux05-ai" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries",
    "Operating System :: OS Independent",
]
dependencies = [
    "dlt[duckdb]>=1.30",
    "dlt[sql_database]>=1.30",
    "pyarrow>=14.0",
    "psycopg2-binary>=2.9",
    "pymysql>=1.1",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "cryptography>=42.0",
    "typer>=0.12",
    "rich>=13.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "apscheduler>=3.10",
    "tenacity>=8.2",
    "structlog>=24.1",
]

[project.urls]
Homepage = "https://github.com/farrux05-ai/chumoli"
Repository = "https://github.com/farrux05-ai/chumoli"
Issues = "https://github.com/farrux05-ai/chumoli/issues"
Documentation = "https://github.com/farrux05-ai/chumoli#readme"

[project.scripts]
chumoli = "chumoli.cli:main"
chumoli-api = "chumoli.api.app:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "build>=1.2",
    "twine>=5.0",
]
postgres = [
    "dlt[postgres]>=1.30",
]
clickhouse = [
    "dlt[clickhouse]>=1.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/chumoli/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/chumoli"]

[tool.hatch.build.targets.wheel.sources]
"src/chumoli" = "chumoli"

# Dashboard lives in src/chumoli/static and is included automatically via
# `packages = ["src/chumoli"]`; no force-include needed (it would duplicate it).

[tool.hatch.build.targets.sdist]
include = [
    "src/chumoli",
    "README.md",
    "CHANGELOG.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
