name: Publish

# Publishes to PyPI when a GitHub Release is published.
#
# Uses PyPI Trusted Publishing (OIDC) — NO API token is stored anywhere.
#
# One-time setup (do this once, on PyPI):
#   1. https://pypi.org/manage/account/publishing/ -> "Add a new pending publisher"
#   2. Fill in:
#        PyPI Project Name : chumoli
#        Owner             : farrux05-ai
#        Repository name   : chumoli
#        Workflow name     : publish.yml
#        Environment name  : pypi
#   3. Save. The next GitHub Release publishes automatically.
#
# To release: bump the version in src/chumoli/__init__.py, update CHANGELOG.md,
# then create a GitHub Release (tag vX.Y.Z). This workflow builds and publishes.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install -U pip build twine

      - name: Build sdist + wheel
        run: python -m build

      - name: Validate metadata
        run: python -m twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/chumoli/
    permissions:
      id-token: write # required for Trusted Publishing (OIDC)
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
