name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install package + dev
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"

      - name: Pytest
        env:
          CHUMOLI_HOME: ${{ runner.temp }}/chumoli-home
          CHUMOLI_DATA: ${{ runner.temp }}/chumoli-data
        run: |
          mkdir -p "$CHUMOLI_HOME" "$CHUMOLI_DATA"
          PYTHONPATH=src python -m pytest tests/ -q --tb=short

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: chumoli:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke — health endpoint
        run: |
          docker images | head -20
          docker run -d --name chumoli-ci \
            -e CHUMOLI_HOME=/data \
            -e CHUMOLI_DATA=/data/chumoli-data \
            -e CHUMOLI_API_KEY=ci-test-key \
            -p 18000:8000 \
            chumoli:ci
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:18000/api/health; then
              echo "health ok"
              docker stop chumoli-ci
              exit 0
            fi
            sleep 2
          done
          echo "=== docker logs ==="
          docker logs chumoli-ci || true
          docker stop chumoli-ci || true
          exit 1
