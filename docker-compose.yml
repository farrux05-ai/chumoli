services:
  chumoli:
    build: .
    image: chumoli:0.1.0
    ports:
      # Bind to localhost only. Exposing 0.0.0.0 requires CHUMOLI_API_KEY + TLS reverse proxy.
      - "127.0.0.1:8000:8000"
    volumes:
      - chumoli_data:/data
    environment:
      CHUMOLI_HOME: /data
      # Optional: set explicitly; otherwise auto-generated in /data/api.key
      # CHUMOLI_API_KEY: change-me
      PYTHONUNBUFFERED: "1"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

volumes:
  chumoli_data:
