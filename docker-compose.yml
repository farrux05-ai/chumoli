services:
  uzpipe:
    build: .
    image: uzpipe:0.1.0
    ports:
      - "8000:8000"
    volumes:
      - uzpipe_data:/data
    environment:
      UZPIPE_HOME: /data
      PYTHONUNBUFFERED: "1"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

volumes:
  uzpipe_data:
