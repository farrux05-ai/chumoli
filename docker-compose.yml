services:
  uzpipe:
    build: .
    image: uzpipe:0.1.0
    ports:
      # Bind to localhost only. Exposing 0.0.0.0 requires UZPIPE_API_KEY + TLS reverse proxy.
      - "127.0.0.1:8000:8000"
    volumes:
      - uzpipe_data:/data
    environment:
      UZPIPE_HOME: /data
      # Optional: set explicitly; otherwise auto-generated in /data/api.key
      # UZPIPE_API_KEY: change-me
      PYTHONUNBUFFERED: "1"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

volumes:
  uzpipe_data:
