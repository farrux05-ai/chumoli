<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ELT Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f7f4ef;--bg-warm:#f0ebe3;--surface:#ffffff;--surface-2:#faf8f5;
  --hover:#efeae2;--border:#e5dfd5;--border-s:#d6cfc3;
  --text:#1c1917;--dim:#57534e;--faint:#a8a29e;
  --accent:#0d9488;--accent-hover:#0f766e;--accent-soft:rgba(13,148,136,0.1);--accent-text:#0f766e;
  --green:#059669;--green-bg:rgba(5,150,105,0.1);
  --red:#dc2626;--red-bg:rgba(220,38,38,0.08);
  --amber:#d97706;--violet:#7c3aed;
  --shadow:0 1px 3px rgba(28,25,23,0.04),0 4px 12px rgba(28,25,23,0.03);
  --shadow-lg:0 8px 30px rgba(28,25,23,0.08);--radius:10px;--radius-sm:7px;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;font-size:13.5px;-webkit-font-smoothing:antialiased;color-scheme:light}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--border-s);border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}
#app{display:flex;height:100vh;overflow:hidden}
#sidebar{width:228px;flex-shrink:0;display:flex;flex-direction:column;border-right:1px solid var(--border);background:var(--bg-warm)}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;background:var(--bg)}
#topbar{height:52px;flex-shrink:0;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border);padding:0 20px;background:var(--surface)}
#content{flex:1;overflow-y:auto;padding:28px 28px 40px}
.ws-header{height:52px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);padding:0 14px}
.ws-logo{width:24px;height:24px;background:var(--accent);border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#fff;flex-shrink:0}
.ws-btn{flex:1;display:flex;align-items:center;justify-content:space-between;padding:6px 8px;border-radius:var(--radius-sm);color:var(--text);font-size:13.5px;font-weight:550;transition:background .12s}
.ws-btn:hover{background:var(--hover)}
.nav-section{flex:1;padding:12px 10px;overflow-y:auto}
.nav-label{font-size:11px;font-weight:550;color:var(--faint);padding:0 10px 8px;text-transform:uppercase;letter-spacing:.04em}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:8px 11px;border-radius:var(--radius-sm);font-size:13.5px;color:var(--dim);transition:all .12s;text-align:left;margin-bottom:2px;font-weight:450}
.nav-item:hover{background:var(--hover);color:var(--text)}
.nav-item.active{background:var(--surface);color:var(--text);font-weight:550;box-shadow:var(--shadow)}
.nav-item svg{width:15px;height:15px;flex-shrink:0;opacity:.75}
.nav-item.active svg{opacity:1;color:var(--accent)}
.nav-badge{margin-left:auto;font-size:10.5px;background:var(--hover);color:var(--dim);padding:1px 7px;border-radius:99px;font-weight:500}
.user-section{border-top:1px solid var(--border);padding:12px 10px}
.user-row{display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:var(--radius-sm)}
.user-avatar{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent-text);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;flex-shrink:0}
.user-name{font-size:13px;font-weight:550}.user-role{font-size:11.5px;color:var(--faint)}
.top-title{font-size:14px;font-weight:550}.top-divider{width:1px;height:16px;background:var(--border)}
.search-btn{display:flex;align-items:center;gap:8px;max-width:320px;flex:1;padding:7px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);color:var(--faint);font-size:13px;transition:border-color .15s,box-shadow .15s}
.search-btn:hover{border-color:var(--border-s);box-shadow:var(--shadow)}
.search-btn svg{width:14px;height:14px;flex-shrink:0}
.top-spacer{flex:1}
.status-pill{display:flex;align-items:center;gap:7px;padding:5px 11px;border:1px solid var(--border);border-radius:8px;font-size:12px;color:var(--dim);background:var(--surface)}
.status-dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 2px rgba(5,150,105,.2)}
kbd{background:var(--bg-warm);border:1px solid var(--border);border-radius:4px;padding:1px 5px;font-size:10.5px;color:var(--faint);font-family:inherit}
.page-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:24px;gap:16px;flex-wrap:wrap}
.page-title{font-size:20px;font-weight:600;letter-spacing:-.02em}
.page-sub{font-size:13.5px;color:var(--faint);margin-top:4px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:0 14px;height:34px;border-radius:8px;font-size:13px;font-weight:500;transition:all .12s;white-space:nowrap;flex-shrink:0}
.btn svg{width:14px;height:14px}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:var(--accent-hover)}
.btn-outline{border:1px solid var(--border-s);color:var(--text);background:var(--surface)}.btn-outline:hover{background:var(--hover)}
.btn-ghost{color:var(--dim)}.btn-ghost:hover{background:var(--hover);color:var(--text)}
.btn-danger{color:var(--red)}.btn-danger:hover{background:var(--red-bg)}
.btn-icon{width:30px;height:30px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:7px}
.btn:disabled{opacity:.45;pointer-events:none}.btn-sm{height:30px;padding:0 11px;font-size:12.5px}
.table-wrap{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;text-align:left}
thead tr{border-bottom:1px solid var(--border);background:var(--surface-2)}
th{padding:11px 16px;font-size:11.5px;font-weight:550;color:var(--faint);text-transform:uppercase;letter-spacing:.03em}
tbody tr{border-bottom:1px solid var(--border);transition:background .1s;cursor:pointer}
tbody tr:last-child{border-bottom:none}tbody tr:hover{background:var(--surface-2)}
td{padding:13px 16px;vertical-align:middle}
.connector-cell{display:flex;align-items:center;gap:12px}
.conn-icon{width:32px;height:32px;border:1px solid var(--border);border-radius:8px;background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--dim);flex-shrink:0}
.conn-icon svg{width:15px;height:15px}
.conn-name{font-size:13.5px;font-weight:550;line-height:1.3}
.conn-meta{font-size:12px;color:var(--faint);line-height:1.35}
.conn-error{font-size:11.5px;color:var(--red);margin-top:2px;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:500}
.status-dot-sm{width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0}
.status.active{color:var(--green)}.status.syncing{color:var(--violet)}.status.error{color:var(--red)}.status.paused{color:var(--faint)}
@keyframes pulse{0%{box-shadow:0 0 0 0 currentColor}70%,100%{box-shadow:0 0 0 5px transparent}}
.status.active .status-dot-sm,.status.syncing .status-dot-sm{animation:pulse 2.2s infinite}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.tag{border:1px solid var(--border);border-radius:5px;padding:2px 8px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--dim);background:var(--bg)}
.row-actions{display:flex;align-items:center;justify-content:flex-end;gap:4px}
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);padding:18px;transition:border-color .15s,box-shadow .15s;box-shadow:var(--shadow)}
.card:hover{border-color:var(--border-s);box-shadow:var(--shadow-lg)}
.card-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.card-icon{width:38px;height:38px;border-radius:9px;border:1px solid var(--border);background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--dim)}
.card-title{font-size:14.5px;font-weight:600}.card-desc{font-size:12.5px;color:var(--faint);margin-top:2px}
.card-meta{display:flex;gap:16px;font-size:12.5px;color:var(--dim);margin-top:8px}
.card-meta span{display:flex;align-items:center;gap:5px}
.empty{text-align:center;padding:56px 24px;color:var(--faint)}
.empty-title{font-size:14.5px;font-weight:550;color:var(--dim);margin-bottom:4px}.empty-sub{font-size:13px}
.overlay{position:fixed;inset:0;background:rgba(28,25,23,.25);backdrop-filter:blur(2px);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.show{opacity:1;pointer-events:all}
.drawer{position:fixed;top:0;right:0;height:100vh;width:460px;max-width:100vw;background:var(--surface);border-left:1px solid var(--border);z-index:50;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s cubic-bezier(.32,.72,0,1);box-shadow:-8px 0 30px rgba(28,25,23,.06)}
.drawer.open{transform:translateX(0)}.drawer.wide{width:580px}
.drawer-head{height:52px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);padding:0 18px;flex-shrink:0}
.drawer-title{font-size:14px;font-weight:550}
.drawer-body{flex:1;overflow-y:auto;padding:22px 18px}
.drawer-foot{border-top:1px solid var(--border);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;background:var(--surface-2)}
.drawer-head-left{display:flex;align-items:center;gap:8px}
.step-bar{display:flex;gap:6px;padding:14px 18px 0;flex-shrink:0}
.step-seg{flex:1;height:3px;border-radius:99px;background:var(--border);transition:background .2s}.step-seg.done{background:var(--accent)}
.section-label{font-size:11.5px;font-weight:550;color:var(--faint);margin-bottom:10px;text-transform:uppercase;letter-spacing:.03em}
.connector-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.connector-card{display:flex;flex-direction:column;gap:8px;padding:14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);text-align:left;transition:all .12s}
.connector-card:hover{border-color:var(--border-s);background:var(--hover)}
.connector-card.selected{border-color:var(--accent);background:var(--accent-soft)}
.cc-icon{width:30px;height:30px;border:1px solid var(--border);border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--dim);background:var(--surface)}
.cc-icon svg{width:14px;height:14px}
.cc-name{font-size:13.5px;font-weight:550}.cc-desc{font-size:12px;color:var(--faint);line-height:1.4;margin-top:1px}
.selected-connector{display:flex;align-items:center;gap:12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);padding:14px;margin-bottom:20px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
label{font-size:12.5px;font-weight:500;color:var(--dim)}
input[type=text],input[type=password],input[type=date],input[type=url],input[type=number],select,textarea{
  height:38px;width:100%;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);padding:0 12px;font-size:13.5px;outline:none;transition:border-color .15s,box-shadow .15s}
textarea{height:auto;padding:10px 12px;resize:vertical;min-height:80px}
input::placeholder,textarea::placeholder{color:var(--faint)}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input.invalid{border-color:var(--red)}
.field-err{font-size:12px;color:var(--red)}.field-hint{font-size:12px;color:var(--faint);line-height:1.55;margin-top:4px}
.dest-list{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.dest-card{display:flex;align-items:center;gap:12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);padding:14px;cursor:pointer;transition:all .12s}
.dest-card:hover{background:var(--hover)}.dest-card.selected{border-color:var(--accent);background:var(--accent-soft)}
.dest-card .check{margin-left:auto;color:var(--accent);width:15px;height:15px;display:none}
.dest-card.selected .check{display:inline-flex}
.test-success{font-size:12.5px;color:var(--green);margin-top:12px;display:flex;align-items:center;gap:6px}
#toast-host{position:fixed;bottom:24px;right:24px;z-index:90;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{padding:12px 16px;border:1px solid var(--border);border-radius:10px;background:var(--surface);font-size:13px;color:var(--text);display:flex;align-items:center;gap:9px;max-width:340px;box-shadow:var(--shadow-lg);animation:slideIn .2s ease}
.toast.success{border-color:rgba(5,150,105,.25)}.toast.error{border-color:rgba(220,38,38,.25)}
@keyframes slideIn{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.spin{animation:spin .8s linear infinite;display:inline-flex}
#cmd-overlay{position:fixed;inset:0;background:rgba(28,25,23,.3);backdrop-filter:blur(3px);z-index:70;display:none;padding-top:14vh;justify-content:center}
#cmd-overlay.show{display:flex}
.cmd-box{width:100%;max-width:540px;background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:var(--shadow-lg)}
.cmd-input-row{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);padding:0 16px}
.cmd-input-row svg{width:16px;height:16px;color:var(--faint);flex-shrink:0}
#cmd-input{flex:1;height:50px;background:transparent;border:none;outline:none;color:var(--text);font-size:15px}
#cmd-input::placeholder{color:var(--faint)}
.cmd-group-label{padding:12px 16px 6px;font-size:11.5px;font-weight:550;color:var(--faint);text-transform:uppercase;letter-spacing:.03em}
.cmd-item{display:flex;align-items:center;gap:11px;padding:11px 16px;cursor:pointer;font-size:13.5px;color:var(--text);transition:background .1s;border-radius:8px;margin:0 8px}
.cmd-item:hover{background:var(--hover)}.cmd-item svg{width:15px;height:15px;color:var(--dim)}
.cmd-list{max-height:360px;overflow-y:auto;padding:6px 0 12px}
#viewer-drawer .tab-bar{display:flex;gap:2px;padding:8px 14px 0;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--surface-2)}
.tab-btn{display:flex;align-items:center;gap:6px;padding:0 14px 10px;font-size:13px;font-weight:500;color:var(--faint);border-bottom:2px solid transparent;transition:all .15s;cursor:pointer;background:none;border:none}
.tab-btn.active{color:var(--text);border-bottom-color:var(--accent)}.tab-btn svg{width:14px;height:14px}
.log-terminal{height:100%;background:var(--bg);padding:16px 18px;overflow-y:auto;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.8}
.log-line{display:flex;gap:12px}.log-time{color:var(--faint);flex-shrink:0;white-space:nowrap;min-width:70px}
.log-stage{flex-shrink:0;width:92px;text-transform:uppercase;font-size:11px;font-weight:550}.log-msg{flex:1}
.log-info .log-stage,.log-info .log-msg{color:var(--dim)}
.log-success .log-stage,.log-success .log-msg{color:var(--green)}
.log-warn .log-stage,.log-warn .log-msg{color:var(--amber)}
.log-error .log-stage,.log-error .log-msg{color:var(--red)}
.schema-list{padding:18px;display:flex;flex-direction:column;gap:14px}
.schema-table{border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;background:var(--surface)}
.schema-head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--bg);border-bottom:1px solid var(--border)}
.schema-head-name{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:550}
.schema-head-rows{font-size:12px;color:var(--faint)}
.schema-col{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;border-bottom:1px solid var(--border);font-size:12.5px}
.schema-col:last-child{border-bottom:none}
.schema-col-name{font-family:'JetBrains Mono',monospace;color:var(--text)}
.schema-col-right{display:flex;align-items:center;gap:8px}
.schema-col-nullable{font-size:11px;color:var(--faint)}
.schema-col-type{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--accent-text)}
.activity-item{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--border)}
.activity-item:last-child{border-bottom:none}
.activity-dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex-shrink:0}
.activity-dot.success{background:var(--green)}.activity-dot.error{background:var(--red)}.activity-dot.info{background:var(--violet)}
.activity-body{flex:1;min-width:0}.activity-title{font-size:13.5px;font-weight:500}.activity-meta{font-size:12px;color:var(--faint);margin-top:2px}
.settings-section{margin-bottom:28px}.settings-section h3{font-size:13.5px;font-weight:600;margin-bottom:12px}
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--border)}
.settings-row:last-child{border-bottom:none}
.settings-label{font-size:13.5px;font-weight:500}.settings-desc{font-size:12px;color:var(--faint);margin-top:2px}
.toggle{width:38px;height:22px;border-radius:99px;background:var(--border);position:relative;cursor:pointer;transition:background .2s;border:none}
.toggle.on{background:var(--accent)}
.toggle::after{content:'';position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:3px;left:3px;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.toggle.on::after{transform:translateX(16px)}
.text-dim{color:var(--dim)}.text-faint{color:var(--faint)}
</style>
</head>
<body>
<div id="app">
<aside id="sidebar">
  <div class="ws-header">
    <div class="ws-logo">E</div>
    <button class="ws-btn" id="ws-switcher" title="Workspace">
      <span id="ws-name">My Workspace</span>
      <span id="i-chevrons"></span>
    </button>
  </div>
  <nav class="nav-section">
    <div class="nav-label">Workspace</div>
    <button class="nav-item active" data-page="connections"><span id="i-plug"></span>Connections<span class="nav-badge" id="nav-conn-count">5</span></button>
    <button class="nav-item" data-page="destinations"><span id="i-database"></span>Destinations</button>
    <button class="nav-item" data-page="logs"><span id="i-scroll"></span>Activity</button>
    <button class="nav-item" data-page="settings"><span id="i-settings"></span>Settings</button>
  </nav>
  <div class="user-section">
    <div class="user-row" style="cursor:default">
      <div class="user-avatar">SU</div>
      <div><div class="user-name">Single user</div><div class="user-role">Local instance</div></div>
    </div>
  </div>
</aside>
<div id="main">
  <header id="topbar">
    <span class="top-title" id="top-title">Connections</span>
    <div class="top-divider"></div>
    <button class="search-btn" id="cmd-trigger">
      <span id="i-search"></span>
      <span style="flex:1;text-align:left">Search or run command...</span>
      <kbd>⌘K</kbd>
    </button>
    <div class="top-spacer"></div>
    <div class="status-pill"><div class="status-dot"></div>All systems operational</div>
  </header>
  <div id="content"></div>
</div>
</div>
<div class="overlay" id="add-overlay"></div>
<div class="drawer" id="add-drawer">
  <div class="drawer-head">
    <div class="drawer-head-left">
      <button class="btn btn-ghost btn-icon" id="drawer-back" style="display:none"><span id="i-arrow-left"></span></button>
      <span class="drawer-title">Add new source</span>
    </div>
    <button class="btn btn-ghost btn-icon" id="add-close"><span id="i-x"></span></button>
  </div>
  <div class="step-bar"><div class="step-seg done" id="seg1"></div><div class="step-seg" id="seg2"></div><div class="step-seg" id="seg3"></div></div>
  <div class="drawer-body" id="drawer-body"></div>
  <div class="drawer-foot"><span style="font-size:12px;color:var(--faint)" id="step-label">Step 1 of 3</span><div id="drawer-action"></div></div>
</div>
<div class="overlay" id="viewer-overlay"></div>
<div class="drawer wide" id="viewer-drawer">
  <div class="drawer-head">
    <div><div class="drawer-title" id="viewer-title">—</div><div style="font-size:11.5px;color:var(--faint)">Live sync viewer</div></div>
    <button class="btn btn-ghost btn-icon" id="viewer-close"><span id="i-x2"></span></button>
  </div>
  <div class="tab-bar">
    <button class="tab-btn active" data-tab="logs" id="tab-logs"><span id="i-terminal"></span>Logs</button>

  drawerBody.querySelectorAll('.connector-card').forEach(btn=>{btn.onclick=()=>{selectedConnector=btn.dataset.id;drawerStep=2;renderDrawer();};});}
function renderStep2(){const con=connectorOf(selectedConnector);
  drawerBody.innerHTML=`<div class="selected-connector"><div class="cc-icon">${svg(con.icon,14)}</div><div><div class="cc-name">${con.name}</div><div class="cc-desc">${con.desc}</div></div></div><div class="field"><label>Connection name</label><input type="text" id="f-name" value="${con.name} — New"/></div><div class="field"><label>Base URL / Host</label><input type="url" id="f-url" placeholder="https://api.example.com/v1"/><div class="field-err" id="e-url"></div></div><div class="field"><label>API key / Password</label><input type="password" id="f-key" placeholder="sk_live_••••••••" class="mono"/><div class="field-err" id="e-key"></div></div><div class="field"><label>Sync start date</label><input type="date" id="f-date"/><div class="field-err" id="e-date"></div></div><p class="field-hint">Credentials are encrypted at rest.</p>`;
  drawerAction.innerHTML=`<button class="btn btn-primary" id="step2-next">${svg('chevron-right',13)} Continue</button>`;
  document.getElementById('step2-next').onclick=()=>{let ok=true;[['e-url','f-url',document.getElementById('f-url').value.trim(),'Base URL is required'],['e-key','f-key',document.getElementById('f-key').value.trim(),'API key is required'],['e-date','f-date',document.getElementById('f-date').value,'Pick a start date']].forEach(([eid,fid,val,msg])=>{const err=document.getElementById(eid),inp=document.getElementById(fid);if(!val){err.textContent=msg;inp.classList.add('invalid');ok=false;}else{err.textContent='';inp.classList.remove('invalid');}});if(ok){drawerStep=3;renderDrawer();}};}
function renderStep3(){testState='idle';
  drawerBody.innerHTML=`<div class="section-label">Choose a destination</div><div class="dest-list">${DESTINATIONS.map(d=>`<div class="dest-card ${selectedDest===d.id?'selected':''}" data-id="${d.id}"><div class="cc-icon">${svg(d.icon,14)}</div><div style="flex:1"><div class="cc-name">${d.name}</div><div class="cc-desc">${d.desc}</div></div><span class="check">${svg('check',14)}</span></div>`).join('')}</div><button class="btn btn-outline" id="test-btn" style="width:100%;justify-content:center" ${selectedDest?'':'disabled'}>${svg('circle-dot',13)} Test connection</button><p class="test-success" id="test-ok" style="display:none">${svg('check',13)} Warehouse reachable — write access confirmed.</p>`;
  drawerBody.querySelectorAll('.dest-card').forEach(card=>{card.onclick=()=>{drawerBody.querySelectorAll('.dest-card').forEach(c=>c.classList.remove('selected'));card.classList.add('selected');selectedDest=card.dataset.id;document.getElementById('test-btn').disabled=false;testState='idle';document.getElementById('test-ok').style.display='none';renderFooter3();};});
  document.getElementById('test-btn').onclick=()=>{testState='testing';const btn=document.getElementById('test-btn');btn.disabled=true;btn.innerHTML=`<span class="spin">${svg('loader-2',13)}</span> Testing...`;setTimeout(()=>{testState='success';btn.innerHTML=`<span style="color:var(--green)">${svg('check',13)}</span> Connection verified`;document.getElementById('test-ok').style.display='flex';renderFooter3();},1200);};renderFooter3();}
function renderFooter3(){const ready=selectedDest&&testState==='success';drawerAction.innerHTML=`<button class="btn btn-primary" id="create-btn" ${ready?'':'disabled'}>${svg('check',13)} Create connection</button>`;
  if(ready)document.getElementById('create-btn').onclick=()=>{const con=connectorOf(selectedConnector);const nameInput=document.getElementById('f-name');const name=(nameInput&&nameInput.value.trim())||`${con.name} — New`;
    const newConn={id:'c'+Date.now(),connector:selectedConnector,name,status:'syncing',lastSync:Date.now(),rows:0,dest:selectedDest,schedule:'1h'};
    connections.unshift(newConn);activityLog.unshift({id:Date.now(),type:'info',title:`${name} created`,meta:'First sync starting · just now',ts:Date.now()});
    toast(`${con.name} connected — first sync starting`,'success');closeAddDrawer();if(currentPage==='connections')renderPage();
    setTimeout(()=>{newConn.status='active';newConn.rows=4200+Math.floor(Math.random()*3000);activityLog.unshift({id:Date.now(),type:'success',title:`${name} synced`,meta:`${fmtRows(newConn.rows)} rows → ${selectedDest} · just now`,ts:Date.now()});if(currentPage==='connections')renderConnectionsTable();},2500);};}
const viewerOverlay=document.getElementById('viewer-overlay'),viewerDrawer=document.getElementById('viewer-drawer');
let viewerConn=null,viewerTab='logs',viewerLogs=[],logInterval=null;
function makeLogs(name){const base=Date.now()-9000;const t=off=>new Date(base+off).toLocaleTimeString('en-GB',{hour12:false});
  return[{t:t(0),level:'info',stage:'extracting',msg:`Connecting to source "${name}"...`},{t:t(900),level:'info',stage:'extracting',msg:'Resolved incremental cursor: updated_at > 2026-09-17T00:00:00Z'},{t:t(1800),level:'info',stage:'extracting',msg:'Fetched page 1/14 — 500 records'},{t:t(3200),level:'info',stage:'extracting',msg:'Fetched page 6/14 — 3,000 records'},{t:t(4400),level:'success',stage:'extracting',msg:'Extraction complete — 7,014 records in 0.9s'},{t:t(5300),level:'info',stage:'normalizing',msg:'Inferring schema for table invoices'},{t:t(6100),level:'warn',stage:'normalizing',msg:'Column "tax_id" widened from int32 → string'},{t:t(6900),level:'info',stage:'normalizing',msg:'Normalized 3 tables, 7,014 rows total'},{t:t(7700),level:'info',stage:'loading',msg:'Opening merge write to destination...'},{t:t(8800),level:'success',stage:'loading',msg:'Loaded 7,014 rows into 3 tables — done'}];}
function openViewer(id){viewerConn=connections.find(c=>c.id===id);if(!viewerConn)return;document.getElementById('viewer-title').textContent=viewerConn.name;viewerTab='logs';viewerLogs=[];document.getElementById('tab-logs').className='tab-btn active';document.getElementById('tab-schema').className='tab-btn';viewerOverlay.classList.add('show');viewerDrawer.classList.add('open');if(logInterval)clearInterval(logInterval);renderViewerBody();const allLogs=makeLogs(viewerConn.name);let i=0;logInterval=setInterval(()=>{if(i>=allLogs.length){clearInterval(logInterval);return;}viewerLogs.push(allLogs[i]);i++;if(viewerTab==='logs')renderLogTerminal();},280);}
function closeViewer(){viewerOverlay.classList.remove('show');viewerDrawer.classList.remove('open');if(logInterval){clearInterval(logInterval);logInterval=null;}}
document.getElementById('viewer-close').onclick=closeViewer;viewerOverlay.onclick=closeViewer;
document.getElementById('tab-logs').onclick=()=>{viewerTab='logs';document.getElementById('tab-logs').className='tab-btn active';document.getElementById('tab-schema').className='tab-btn';renderViewerBody();};
document.getElementById('tab-schema').onclick=()=>{viewerTab='schema';document.getElementById('tab-schema').className='tab-btn active';document.getElementById('tab-logs').className='tab-btn';renderViewerBody();};
function renderViewerBody(){if(viewerTab==='logs')renderLogTerminal();else renderSchema();}
function renderLogTerminal(){const body=document.getElementById('viewer-body');body.innerHTML=`<div class="log-terminal" id="log-term">${viewerLogs.length===0?'<span style="color:var(--faint)">Waiting for sync to start...</span>':viewerLogs.map(l=>`<div class="log-line log-${l.level}"><span class="log-time">${l.t}</span><span class="log-stage">${l.stage}</span><span class="log-msg">${l.msg}</span></div>`).join('')}</div>`;const term=document.getElementById('log-term');if(term)term.scrollTop=term.scrollHeight;}
function renderSchema(){const body=document.getElementById('viewer-body');body.style.overflowY='auto';const schema=SCHEMA_MAP[viewerConn?.connector]||SCHEMA_MAP.didox;
  body.innerHTML=`<div class="schema-list">${schema.map(t=>`<div class="schema-table"><div class="schema-head"><span class="schema-head-name">${t.name}</span><span class="schema-head-rows">${t.rows.toLocaleString()} rows</span></div>${t.cols.map(c=>`<div class="schema-col"><span class="schema-col-name">${c.name}</span><div class="schema-col-right">${c.nullable?'<span class="schema-col-nullable">nullable</span>':''}<span class="schema-col-type">${c.type}</span></div></div>`).join('')}</div>`).join('')}</div>`;}
const cmdOverlay=document.getElementById('cmd-overlay');
const cmdItems=[{icon:'plug',label:'Add new source',action:()=>openAddDrawer()},{icon:'refresh-cw',label:'Sync all connections',action:()=>{toast('Syncing all...','loading','all');connections.filter(c=>c.status==='active'||c.status==='error').forEach((c,i)=>setTimeout(()=>syncNow(c.id),i*400));setTimeout(()=>toastUpdate('all','All connections queued','success'),1200);}},{icon:'database',label:'Go to Destinations',action:()=>document.querySelector('[data-page="destinations"]').click()},{icon:'scroll',label:'Go to Activity',action:()=>document.querySelector('[data-page="logs"]').click()},{icon:'settings',label:'Open Settings',action:()=>document.querySelector('[data-page="settings"]').click()}];
function openCmd(){cmdOverlay.classList.add('show');document.getElementById('cmd-input').value='';renderCmdList('');setTimeout(()=>document.getElementById('cmd-input').focus(),40);}
function closeCmd(){cmdOverlay.classList.remove('show');}
document.getElementById('cmd-trigger').onclick=openCmd;document.getElementById('cmd-overlay').onclick=e=>{if(e.target===cmdOverlay)closeCmd();};
document.getElementById('cmd-input').oninput=e=>renderCmdList(e.target.value);
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();cmdOverlay.classList.contains('show')?closeCmd():openCmd();}if(e.key==='Escape'&&cmdOverlay.classList.contains('show'))closeCmd();});
function renderCmdList(q){const list=document.getElementById('cmd-list');const filtered=cmdItems.filter(i=>i.label.toLowerCase().includes(q.toLowerCase()));
  list.innerHTML=`<div class="cmd-group-label">Actions</div>`+(filtered.length?filtered.map((item,i)=>`<div class="cmd-item" data-i="${i}">${svg(item.icon,14)}<span>${item.label}</span></div>`).join(''):`<div style="padding:28px;text-align:center;color:var(--faint)">No results</div>`);
  list.querySelectorAll('.cmd-item').forEach(el=>{el.onclick=()=>{closeCmd();filtered[parseInt(el.dataset.i)].action();};});}
(function(){const saved=localStorage.getItem('elt_ws_name');if(saved){const el=document.getElementById('ws-name');if(el)el.textContent=saved;}})();
renderPage();
setInterval(()=>{if(currentPage==='connections')renderConnectionsTable();},30000);
</script>
</body>
</html>
